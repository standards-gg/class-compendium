<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Combat Rogue 1-30 Deck</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#03040a;color:#f4ecd8;font-family:system-ui,sans-serif;overflow:hidden}
  #stage{position:absolute;inset:0 0 74px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #frame{width:1920px;height:1080px;border:0;transform-origin:center center;flex:none;background:#05070f;box-shadow:0 20px 80px rgba(0,0,0,.8)}
  .nav{position:absolute;top:0;bottom:74px;width:12%;display:flex;align-items:center;cursor:pointer;opacity:0;transition:opacity .2s;z-index:5;
       font:900 64px 'Arial Black',sans-serif;color:#fff56a;text-shadow:0 0 20px #000}
  .nav:hover{opacity:1}
  #prev{left:0;justify-content:flex-start;padding-left:24px;background:linear-gradient(90deg,rgba(0,0,0,.5),transparent)}
  #next{right:0;justify-content:flex-end;padding-right:24px;background:linear-gradient(270deg,rgba(0,0,0,.5),transparent)}
  #bar{position:absolute;left:0;right:0;bottom:0;height:74px;background:#070b17;border-top:2px solid #5a4a1e;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:6}
  #thumbs{display:flex;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none}
  .t{flex:none;width:92px;height:52px;border:2px solid #3a3320;border-radius:4px;background-size:cover;background-position:center;cursor:pointer;opacity:.55;transition:.15s;position:relative}
  .t:hover{opacity:.9}
  .t.on{border-color:#fff56a;opacity:1;box-shadow:0 0 12px rgba(255,245,106,.6)}
  .t b{position:absolute;left:3px;top:1px;font:800 12px sans-serif;color:#fff56a;text-shadow:0 0 3px #000}
  button{background:#fff56a;color:#0a0c14;border:0;font:800 14px sans-serif;letter-spacing:.08em;padding:10px 14px;border-radius:5px;cursor:pointer;text-transform:uppercase}
  button:hover{background:#fff}
  #ct{font:800 15px sans-serif;letter-spacing:.1em;color:#a9a490;min-width:70px;text-align:center}
</style></head><body>
<div id="stage"><iframe id="frame" title="slide"></iframe></div>
<div class="nav" id="prev">&#10094;</div><div class="nav" id="next">&#10095;</div>
<div id="bar"><button id="b1">&#9664; Prev</button><span id="ct"></span><button id="b2">Next &#9654;</button><div id="thumbs"></div><button id="fs">Fullscreen</button></div>
<script>
const S=['01-cover','02-talent-builds','03-rotation','04-level-plan','05-poisons-weapons-stats','06-dungeon-weapons','07-races','08-professions','09-macros-trainers','10-after-30'];
const f=document.getElementById('frame'),st=document.getElementById('stage'),th=document.getElementById('thumbs'),ct=document.getElementById('ct');
let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1));
S.forEach((n,k)=>{const d=document.createElement('div');d.className='t';d.style.backgroundImage=`url(png/${n}.png?v=${Date.now()})`;d.innerHTML=`<b>${k+1}</b>`;d.onclick=()=>go(k);th.appendChild(d)});
function fit(){const s=Math.min(st.clientWidth/1920,st.clientHeight/1080);f.style.transform=`scale(${s})`;f.style.margin=`${-(1080*(1-s))/2}px ${-(1920*(1-s))/2}px`}
function go(k){i=Math.max(0,Math.min(S.length-1,k));f.src=`slides/${S[i]}.html?v=${Date.now()}`;ct.textContent=`${i+1} / ${S.length}`;history.replaceState(null,'','#'+(i+1));
 [...th.children].forEach((c,j)=>c.classList.toggle('on',j===i));th.children[i].scrollIntoView({block:'nearest',inline:'center'})}
document.getElementById('prev').onclick=document.getElementById('b1').onclick=()=>go(i-1);
document.getElementById('next').onclick=document.getElementById('b2').onclick=()=>go(i+1);
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(i+1)}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(i-1)}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='f'||e.key==='F')document.getElementById('fs').click()});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(i+(d<0?1:-1));x0=null});
addEventListener('resize',fit);fit();go(i);
</script></body></html>
